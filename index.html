  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(
          rgba(10,12,25,0.75),
          rgba(10,12,25,0.85)
        ),
        url("https://cdn.phototourl.com/uploads/2026-02-16-88e0fb79-e83f-4b94-8fc6-586805a1bd87.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #ffffff;
    }

    .container {
      max-width: 420px;
      margin: auto;
      padding: 30px 15px 40px;
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #2ee6c5;
      box-shadow: 0 0 25px rgba(46,230,197,0.4);
      margin-bottom: 15px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .location {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 12px;
    }

    .note {
      font-size: 13px;
      line-height: 1.5;
      opacity: 0.85;
      margin-bottom: 20px;
    }

    .section {
      margin: 22px 0 10px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      margin: 12px 0;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,0.85);
      background: rgba(0,0,0,0.45);
      text-decoration: none;
      color: #2ee6c5;
      font-weight: bold;
      transition: 0.25s ease;
      backdrop-filter: blur(5px);
    }

    .btn img {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
    }

    .btn:hover {
      transform: scale(1.04);
      background: rgba(0,0,0,0.65);
      box-shadow: 0 0 18px rgba(46,230,197,0.3);
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      opacity: 0.6;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <div class="container">
